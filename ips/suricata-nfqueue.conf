# systemd drop-in to run Suricata in IPS (nfqueue) mode instead of the stock
# af-packet (IDS) mode. The packaged service launches with --af-packet, which
# ignores LISTENMODE=nfqueue in /etc/default/suricata, so nothing consumes the
# NFQUEUE and dropped packets just bypass.
#
# Deploy to: /etc/systemd/system/suricata.service.d/nfqueue.conf
# Then:      sudo systemctl daemon-reload && sudo systemctl restart suricata
# Verify:    the suricata.log should say  "nfq: NFQ running in standard ACCEPT/DROP mode"

[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D -q 0 -c /etc/suricata/suricata.yaml --pidfile /run/suricata.pid

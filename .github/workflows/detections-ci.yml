name: Detection-as-Code CI

# Runs on every push and pull request, and can be triggered manually.
# Proves that every detection in the repo is valid and consistent before it ships.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate detections
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pyyaml sigma-cli

      # The real Sigma tool. Kept non-blocking because one of its validators
      # (D3FEND) downloads MITRE data at runtime and can be unavailable; the
      # hard structural gate below already enforces valid Sigma (UUIDs, body...).
      - name: Sigma spec check (sigma-cli)
        continue-on-error: true
        run: |
          sigma check detections/sigma/ \
            || echo "::warning::sigma check reported issues or the network-dependent D3FEND validator was unavailable"

      # The authoritative gate: structural + consistency validation, no network.
      - name: Detection test harness
        run: python3 tests/validate_detections.py

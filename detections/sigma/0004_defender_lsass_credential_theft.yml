title: Microsoft Defender Blocked a Credential-Theft Attempt Against LSASS
id: 1f1cd96b-3f64-43d2-a816-c1a5ae74ae6c
status: experimental
description: |
  Detects Microsoft Defender Antivirus detecting (Event 1116) or remediating (Event 1117) a
  credential-theft tool that targets LSASS - for example HackTool:Win32/DumpLsass, Mimikatz,
  WDigest, Pwdump or Gsecdump. This is a high-confidence, defense-in-depth signal: the attack was
  attempted AND already blocked by the endpoint control, but it means something on the host is
  trying to steal credentials and must be investigated. In the Himal Traders threat model this is
  Path 1 step 3 / Path 3 step 4: dumping LSASS on DC01 to steal Active Directory credentials.
author: Prashan Ghimire
date: 2026/10/16
references:
  - internal threat model, detection priority #4 (crown jewel - credential access)
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference
logsource:
  product: windows
  service: windows-defender
detection:
  selection:
    EventID:
      - 1116
      - 1117
  credential_tools:
    ThreatName|contains:
      - 'Lsass'
      - 'Mimikatz'
      - 'WDigest'
      - 'Pwdump'
      - 'Gsecdump'
      - 'Samdump'
      - 'DumpCreds'
      - 'CredentialStealer'
  condition: selection and credential_tools
fields:
  - ThreatName
  - Path
  - SeverityName
  - DetectionUser
falsepositives:
  - Authorized red-team or security tooling tests (should be pre-announced and documented)
  - A security tool with an LSASS-related name flagged by signature (rare; verify the path)
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001

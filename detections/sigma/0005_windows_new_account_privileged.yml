title: New Account Created or Added to Privileged Group
id: 0a1b2c3d-0005-4a1a-9f05-himaltraders05
status: experimental
description: |
  Detects creation of a new Windows account (4720) and addition of an account to a
  security group (4728/4732/4756), with high severity when the group is privileged
  (Domain Admins, Administrators, Enterprise Admins). In the Himal Traders environment
  this is Path 1 step 4: an attacker planting a backdoor admin account for persistence.
author: Prashanna Ghimire
date: 2026/10/15
references:
  - internal threat model, detection priority #5
logsource:
  product: windows
  service: security
detection:
  create_account:
    EventID: 4720
  add_to_group:
    EventID:
      - 4728
      - 4732
      - 4756
  privileged_group:
    TargetUserName:
      - 'Domain Admins'
      - 'Administrators'
      - 'Enterprise Admins'
      - 'Schema Admins'
  condition: create_account or add_to_group or (add_to_group and privileged_group)
fields:
  - TargetUserName
  - SubjectUserName
  - MemberSid
falsepositives:
  - Legitimate IT onboarding of new staff during working hours
  - Planned administrative group changes (change ticket should exist)
level: high
tags:
  - attack.persistence
  - attack.t1136
  - attack.privilege-escalation
  - attack.t1098
